spring:
  application:
    name: depositocpc-backend
  profiles:
    default: local

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  expiracion-minutos: 480

patio:
  altura-maxima-apilamiento: 3

cors:
  # Orígenes permitidos separados por coma. En producción se inyecta CORS_ORIGINS
  # con el dominio real del frontend (ej: https://depositocpc-frontend.vercel.app)
  origenes-permitidos: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
